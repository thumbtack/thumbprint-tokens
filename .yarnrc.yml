# Block all git-sourced dependencies. The tree resolves only npm, patch and
# workspace protocols today. Add URL glob patterns here to allow specific ones.
approvedGitRepositories: []

# Written by Yarn's v4 migration to preserve the Yarn 3 default (Yarn 4 uses 0).
# Load-bearing: the cache key encodes this value, so dropping the line would
# change the key from 10 to 10c0 and invalidate every checksum in yarn.lock.
compressionLevel: mixed

# Redundant under Yarn 4, which already defaults to true. Kept because it
# records the intent and was required under Yarn 3, where the default was false.
enableGlobalCache: true

# Yarn 3 allowed dependency install scripts by default and Yarn 4 does not, and
# migrating the lockfile to v10 disables the compat shim that would have kept
# the old value. Pinned here so this upgrade stays behavior-neutral. husky needs
# it: its install script writes the pre-commit hook, and without it
# `pretty-quick --staged` silently stops running on commit.
enableScripts: true

# Yarn 4 defaults to Plug'n'Play, which replaces node_modules with a resolver in
# .pnp.cjs. Keep the classic tree: ts-node, jest and eslint here are not
# configured for PnP.
nodeLinker: node-modules

# Refuse to install any package version published less than 3 days ago, giving
# malicious releases time to be caught and unpublished.
npmMinimalAgeGate: "3d"

yarnPath: .yarn/releases/yarn-4.17.0.cjs
